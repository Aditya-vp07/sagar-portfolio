<svg viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
  <style>
    .box { fill: #ffffff; stroke: #1a1815; stroke-width: 1.5; rx: 6; }
    .gate { fill: #fff; stroke: #c2410c; stroke-width: 2; rx: 6; }
    .label { fill: #1a1815; }
    .muted { fill: #6b6660; font-size: 11px; }
    .arrow { stroke: #c2410c; stroke-width: 1.5; fill: none; marker-end: url(#a); }
  </style>
  <defs>
    <marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect x="20" y="60" width="170" height="70" class="box"/>
  <text x="105" y="88" text-anchor="middle" class="label">prompt / flow</text>
  <text x="105" y="108" text-anchor="middle" class="label">change</text>
  <text x="105" y="122" text-anchor="middle" class="muted">voice agents, BFSI</text>

  <rect x="280" y="60" width="200" height="70" class="gate"/>
  <text x="380" y="88" text-anchor="middle" class="label">regression harness</text>
  <text x="380" y="108" text-anchor="middle" class="muted">automated evals on prompts &amp; flows</text>
  <text x="380" y="122" text-anchor="middle" class="muted">+ pre-ship quality checks</text>

  <rect x="570" y="60" width="160" height="70" class="box"/>
  <text x="650" y="88" text-anchor="middle" class="label">production</text>
  <text x="650" y="108" text-anchor="middle" class="muted">millions of calls / month</text>
  <text x="650" y="122" text-anchor="middle" class="muted">enterprise customers</text>

  <line x1="190" y1="95" x2="274" y2="95" class="arrow"/>
  <line x1="480" y1="95" x2="564" y2="95" class="arrow"/>

  <text x="380" y="165" text-anchor="middle" class="muted">the ship / no-ship mechanism — the artifact I built and owned</text>
</svg>
